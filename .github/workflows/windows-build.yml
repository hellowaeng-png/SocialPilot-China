name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'socialpilot/**'
      - 'requirements.txt'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name SocialPilotChina --collect-all PySide6 socialpilot/main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: iscc installer/SocialPilotChina.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SocialPilotChina-Windows-Installer
          path: dist-installer/SocialPilotChina_Setup.exe
          if-no-files-found: error
